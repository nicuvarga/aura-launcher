name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk aura-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aura-launcher
          path: aura-launcher.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest aura-launcher.apk --title "Aura Launcher build ${{ github.run_number }}" --notes "Build automat" --target "$GITHUB_SHA"
